[build-system]
requires = ["setuptools", "wheel", "oldest-supported-numpy", "setuptools-git-versioning"]
build-backend = "setuptools.build_meta"

[project]
name = "delta2"
dynamic = ["version"]
description = "Segments and tracks bacteria"
readme = "README.md"
requires-python = ">=3.8,<3.11"
authors = [
    { name = "Jean-Baptiste Lugagne", email = "jblugagne@bu.edu" },
    { name = "Owen OConnor", email = "ooconnor@bu.edu" },
    { name = "Virgile Andreani", email = "andreani@bu.edu" },
]
dependencies = [
    "numpy >= 1.21",
    "scipy >= 1.7",
    "pooch >= 1.6",
    "tensorflow >= 2.7",
    "scikit-image >= 0.19",
    "opencv-python >= 4.6",
    "tqdm >= 4.57",
    "ffmpeg-python>=0.2",
]

[project.optional-dependencies]
test = [
    "pytest >= 7.0",
    "pytest-order >= 1.0",
]
train = [
    "elasticdeform >= 0.5",
]

[project.license]
text = "MIT License"
files = ["LICENSE"]

[project.urls]
repository = "https://gitlab.com/dunloplab/delta"
documentation = "https://delta.readthedocs.io"

[tool.setuptools]
packages = ["delta"]

[tool.setuptools-git-versioning]
enabled = true

[tool.ruff]
target-version = "py38"
# We use numpy docstring convention, this implements it
extend-select = ["D"]
extend-ignore = [
    "D107",
    "D203",
    "D212",
    "D213",
    "D402",
    "D413",
    "D415",
    "D416",
    "D417",
]
